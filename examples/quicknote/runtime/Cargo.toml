[package]
name = "quicknote_runtime"
version = "0.2.0"
edition = "2021"
description = "Quicknote browser extension example for crepuscularity"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crepuscularity-web    = { path = "../../../crates/crepuscularity-web" }
crepuscularity-core   = { path = "../../../crates/crepuscularity-core" }
crepuscularity-webext = { path = "../../../crates/crepuscularity-webext" }
serde                 = { version = "1.0", features = ["derive"] }
serde_json            = "1.0"
serde-wasm-bindgen    = "0.6"
wasm-bindgen = "=0.2.126"

[workspace]
