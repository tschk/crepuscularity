[package]
name = "text-features"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false

[[bin]]
name = "text-features"
path = "src/main.rs"

[features]
default = []
# Enable the text extras supported by the pinned GPUI revision.
vendor-gpui-text = ["crepuscularity-gpui/gpui-text-extras"]

[dependencies]
gpui = { package = "gpui-ce", version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit"] }
crepuscularity-gpui = { path = "../../../crates/crepuscularity-gpui" }
