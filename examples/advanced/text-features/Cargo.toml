[package]
name = "text-features"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false

[[bin]]
name = "text-features"
path = "src/main.rs"

[features]
default = []
# Enable the text extras supported by the pinned GPUI revision.
vendor-gpui-text = ["crepuscularity-gpui/gpui-text-extras"]

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
crepuscularity-gpui = { path = "../../../crates/crepuscularity-gpui" }
