[package]
name = "local-scrobbler"
version = "0.1.0"
edition = "2021"
publish = false
license = "ISC"

[workspace]

[lib]
name = "local_scrobbler"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
crepuscularity-gpui = { path = "../../../crates/crepuscularity-gpui" }
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97" }
