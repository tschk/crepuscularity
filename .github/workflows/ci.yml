name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4 # v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Set SDKROOT (macOS)
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - name: WASM target and wasm-bindgen (crepus web build integration tests)
        run: |
          rustup target add wasm32-unknown-unknown
          VERSION=$(grep -A2 'name = "wasm-bindgen"' Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "wasm-bindgen $VERSION (from Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
        shell: bash

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Test CLI with all features
        run: cargo test --locked --package crepuscularity-cli --features full
        if: matrix.os == 'ubuntu-latest'

  build-examples:
    name: Build Examples
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set SDKROOT (macOS)
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - name: Build weather example
        run: cargo build --locked
        working-directory: examples/weather
        if: runner.os != 'Windows'

      - name: Build CLI
        run: cargo build --locked --package crepuscularity-cli --features full

  plugin-smoke:
    name: Plugin Smoke
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-plugin-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-plugin-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4 # v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-plugin-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Set SDKROOT
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.x"

      - name: Install Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "3.3"

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install V
        # Pinned to V release v0.5.1; continue-on-error because V is experimental
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v0.5.1 https://github.com/vlang/v.git /tmp/v
          make -C /tmp/v
          echo "/tmp/v" >> "$GITHUB_PATH"

      - name: Install Kotlin
        run: |
          KOTLIN_VERSION=2.1.21
          curl -fsSL -o /tmp/kotlin-compiler.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Print plugin toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          go version
          bun --version
          v version || echo "V not installed (experimental)"
          zig version
          swiftc --version
          gcc --version | head -n 1
          g++ --version | head -n 1
          ruby --version
          php --version | head -n 1
          javac -version
          kotlinc -version
          dotnet --version

      - name: Run plugin smoke
        run: bash scripts/plugin-smoke.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev

      - name: Build docs (strict rustdoc)
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  parallel-web-build:
    name: Parallel WASM + Host Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parallel-web-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - name: Install WASM target + wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          VERSION=$(grep -A2 'name = "wasm-bindgen"' Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "wasm-bindgen $VERSION (from Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build WASM client
        run: |
          cargo build --locked --target wasm32-unknown-unknown -p crepuscularity-web --release &
          WASM_PID=$!
          # Build host server in parallel
          cargo build --locked -p crepuscularity-cli --release --features full &
          HOST_PID=$!
          wait $WASM_PID
          wait $HOST_PID
          echo "Both WASM client and host server built successfully"

      - name: Build docs-site (end-to-end web build)
        run: |
          cargo run --locked -p crepuscularity-cli --release -- \
            web build --manifest docs-site/crepus.toml --out-dir /tmp/crepus-docs-dist
          # Verify outputs exist
          test -f /tmp/crepus-docs-dist/index.html || (echo "missing index.html" && exit 1)
          test -f /tmp/crepus-docs-dist/pkg/runtime_bg.wasm || (echo "missing WASM bundle" && exit 1)
          echo "Parallel web build verified — host SSR + WASM client both built"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2025-0052

      - name: Run cargo deny check
        run: cargo deny check

      - name: Run npm audit
        continue-on-error: true
        run: |
          # Run npm audit in every directory containing a package.json
          # (benchmark apps have known vulns being addressed separately)
          find . -name package.json -not -path "*/node_modules/*" -not -path "*/dist/*" -print0 |
            while IFS= read -r -d '' pkg; do
              dir="$(dirname "$pkg")"
              echo "::group::npm audit — $dir"
              (cd "$dir" && npm audit --audit-level=high || true)
              echo "::endgroup::"
            done
