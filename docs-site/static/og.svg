<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Crepuscularity — UI templates that compile everywhere</title>
  <desc id="description">A zinc-dark banner with a gold, violet, and sky-blue twilight horizon and the Crepuscularity ring mark. Desktop, web, extensions, terminal, mobile, and embedded.</desc>
  <defs>
    <linearGradient id="twilight" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fcd58a"/>
      <stop offset="0.48" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0.58" stop-color="#09090b" stop-opacity="0"/>
      <stop offset="0.77" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.58" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="artwork">
      <rect width="1200" height="520"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="#09090b"/>
  <g clip-path="url(#artwork)">
    <circle cx="1170" cy="280" r="380" fill="url(#halo)"/>
    <circle cx="1170" cy="280" r="285" fill="none" stroke="url(#twilight)" stroke-width="38" opacity="0.4" filter="url(#glow)"/>
    <circle cx="1170" cy="280" r="285" fill="none" stroke="url(#twilight)" stroke-width="2" opacity="0.75"/>
  </g>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">
    <g transform="translate(64 62)">
      <circle cx="20" cy="20" r="20" fill="url(#twilight)" opacity="0.95"/>
      <circle cx="20" cy="20" r="10" fill="#030712" opacity="0.35"/>
      <text x="56" y="29" fill="#fafafa" font-size="26" font-weight="600" letter-spacing="-1">crepuscularity</text>
    </g>
    <text x="60" y="290" fill="#fafafa" font-size="62" font-weight="600" letter-spacing="-3">UI templates that</text>
    <text x="60" y="371" fill="url(#headline)" font-size="62" font-weight="600" letter-spacing="-3">compile everywhere</text>
    <text x="64" y="435" fill="#a1a1aa" font-size="20">Desktop · Web · Extensions · Terminal</text>
    <text x="64" y="468" fill="#a1a1aa" font-size="20">Mobile · Embedded</text>
    <path d="M64 521 H1136" stroke="#27272a"/>
    <text x="64" y="565" fill="#d4d4d8" font-size="17">Build interfaces in Rust.</text>
    <text x="1136" y="565" fill="#a1a1aa" font-size="17" text-anchor="end">crepuscularity.tsc.hk</text>
  </g>
</svg>
