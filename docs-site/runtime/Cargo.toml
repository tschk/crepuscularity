[package]
name = "docs_site_runtime"
version = "0.1.0"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crepuscularity-web = { path = "../../crates/crepuscularity-web" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCollection", "MouseEvent", "NodeList", "PointerEvent", "Response", "Window"] }

# ponytail: LTO + size opts shrinks WASM ~40% over wasm-opt alone
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[workspace]
