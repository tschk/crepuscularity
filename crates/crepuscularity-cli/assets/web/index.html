<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__CREPUS_TITLE__</title>
  <meta name="description" content="__CREPUS_DESC__">
__CREPUS_OG__
__CREPUS_GOOGLE_FONTS__
__CREPUS_EXTRA_HEAD__
  <style>
    :root {
      --accent: __THEME_ACCENT__;
      --accent-soft: __THEME_ACCENT_SOFT__;
      --surface: __THEME_SURFACE__;
      --text: __THEME_TEXT__;
      --muted: __THEME_MUTED__;
      --border: __THEME_BORDER__;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: __CREPUS_BODY_FONT__;
      -webkit-font-smoothing: antialiased;
    }
    .crepus-slot {
      display: inline-block;
      position: relative;
      overflow: hidden;
      vertical-align: baseline;
      min-height: 1.15em;
    }
    .crepus-slot__inner {
      display: block;
      will-change: transform, opacity, filter;
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .crepus-slot__inner {
        /* The rotation runtime sets these effects inline. */
        transition: none !important;
        opacity: 1 !important;
        filter: none !important;
        will-change: auto;
      }
    }
    /* ponytail: hide until UnoCSS + app.js are ready to prevent FOUC */
    #crepus-root { opacity: 0; }
  </style>
  <script src="./vendor/unocss.js"></script>
</head>
<body>
  __CREPUS_NOSCRIPT__
  <div id="crepus-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
