[package]
name = "crepuscularity_macros"
version = "0.5.13"
edition = "2021"
license = "ISC"
description = "Compile-time view! macro for Crepuscularity templates (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity_macros"
readme = "../../README.md"

[features]
default = []
# `Div::letter_spacing`, `Div::text_transform`, and `gpui::TextTransform` (needs GPUI newer than crates.io 0.2.2; this repo uses a patched vendor tree).
gpui_text_run_styles = []

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.6.0" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
