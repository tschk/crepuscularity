[package]
name = "crepuscularity-core"
version = "0.6.0"
edition = "2021"
license = "ISC"
description = "Parser, AST, and expression evaluation for the Crepuscularity .crepus DSL (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-core"
readme = "../../README.md"

[dependencies]
toml = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
