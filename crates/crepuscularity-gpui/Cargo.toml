[package]
name = "crepuscularity-gpui"
version = "0.5.10"
edition = "2021"
license = "ISC"
description = "GPUI backend for Crepuscularity (view! macro re-exports) — UNSTABLE; in active development."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-gpui"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
# Default enables font-kit (cross-platform) but NO platform backend.
# You must enable at least one of: wayland, x11, macos, or windows.
default = ["font-kit"]
font-kit = ["gpui/font-kit"]
full-gpui = ["gpui/default"]
# Platform backends (choose at least one for your target). With gpui-ce the backend crates are
# selected automatically per-target by `gpui_platform`; these features propagate the backend
# choice (Linux needs wayland and/or x11, macOS/Windows are automatic).
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
macos = []
windows = []
# Cross-platform extras
inspector = ["gpui/inspector"]
leak-detection = ["gpui/leak-detection"]
screen-capture = ["gpui_platform/screen-capture"]
runtime-shaders = ["gpui_platform/runtime_shaders"]
test-support = ["gpui_platform/test-support"]
gpui-text-extras = [
    "crepuscularity_macros/gpui_text_run_styles",
    "crepuscularity-runtime/gpui_text_run_styles",
]
# symbols feature temporarily removed — gpui-symbols 0.6 depends on crates.io gpui 0.2.2,
# which conflicts with the gpui-ce fork. Re-add once gpui-symbols publishes a gpui-ce-compatible release.

[dependencies]
gpui = { package = "gpui-ce", version = "0.2.2", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0" }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.12" }
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.20" }
# gpui-symbols = { version = "0.6", optional = true } # incompatible with gpui-ce
pollster = "0.4"
