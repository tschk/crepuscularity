[package]
name = "crepuscularity-lsp"
version = "0.2.9"
edition = "2021"
authors = ["Max Carter <max@undivisible.dev>"]
license = "ISC"
description = "Language server for Crepuscularity .crepus templates (Diagnostics from crepuscularity-core)."
repository = "https://github.com/tschk/crepuscularity"
readme = "../../README.md"
publish = true

[[bin]]
name = "crepus-lsp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp = { version = "0.20", features = ["runtime-tokio"] }
tower = { version = "0.4", features = ["util"], default-features = false }

[dev-dependencies]
