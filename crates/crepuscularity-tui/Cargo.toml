[package]
name = "crepuscularity-tui"
version = "0.4.24"
edition = "2021"
license = "ISC"
description = "Ratatui backend for the Crepuscularity .crepus DSL — write full-screen terminal UIs with nested div layouts."
repository = "https://github.com/tschk/crepuscularity"
readme = "../../README.md"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0", features = ["notify"] }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.12" }
crossterm = "0.29"
notify = { workspace = true }
ratatui = { workspace = true }
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = "0.8.2"
ratatui = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "render_bench"
harness = false

[[bench]]
name = "diff_bench"
harness = false
