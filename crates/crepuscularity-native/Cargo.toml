[package]
name = "crepuscularity-native"
version = "0.6.5"
edition = "2021"
license = "ISC"
description = "View intermediate representation (JSON) for native SwiftUI / Compose shells (UNSTABLE)."
repository = "https://github.com/tschk/crepuscularity"
readme = "../../README.md"

[features]
default = []
# JSON Schema export for Swift/Kotlin/quicktype pipelines (`export-view-ir-schema` binary).
schema = ["dep:schemars"]

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
toml = { workspace = true }

[dev-dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "parity-report"
path = "src/bin/parity_report.rs"

[[bin]]
name = "export-view-ir-schema"
path = "src/bin/export_view_ir_schema.rs"
required-features = ["schema"]
