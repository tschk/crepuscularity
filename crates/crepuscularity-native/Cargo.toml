[package]
name = "crepuscularity-native"
version = "0.6.5"
edition = "2021"
license = "ISC"
description = "View intermediate representation (JSON) for native SwiftUI / Compose shells (UNSTABLE)."
repository = "https://github.com/tschk/crepuscularity"
readme = "../../README.md"

[features]
default = []
web-modules = ["dep:raffia", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_semantic", "dep:oxc_transformer", "dep:oxc_codegen", "dep:oxc_syntax"]
# JSON Schema export for Swift/Kotlin/quicktype pipelines (`export-view-ir-schema` binary).
schema = ["dep:schemars"]

[dependencies]
raffia = { version = "=0.13.0", optional = true }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
toml = { workspace = true }
stacker = "0.1.24"

oxc_allocator = { version = "0.128", optional = true }
oxc_ast = { version = "0.128", optional = true }
oxc_ast_visit = { version = "0.128", optional = true }
oxc_parser = { version = "0.128", optional = true }
oxc_span = { version = "0.128", optional = true }
oxc_semantic = { version = "0.128", optional = true }
oxc_transformer = { version = "0.128", optional = true }
oxc_codegen = { version = "0.128", optional = true }
oxc_syntax = { version = "0.128", optional = true }

[dev-dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "parity-report"
path = "src/bin/parity_report.rs"

[[bin]]
name = "export-view-ir-schema"
path = "src/bin/export_view_ir_schema.rs"
required-features = ["schema"]
