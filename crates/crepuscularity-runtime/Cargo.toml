[package]
name = "crepuscularity-runtime"
version = "0.4.19"
edition = "2021"
license = "ISC"
description = "Runtime parser, GPUI renderer, and hot-reload engine for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-runtime"
readme = "../../README.md"

[features]
default = []
# See `crepuscularity_macros` / gpui_text_run_styles — stock crates.io gpui 0.2.2 lacks these APIs.
gpui_text_run_styles = []

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0", features = ["notify"] }
# Pinned to gpui-ce git main (tracks upstream Zed newer than crates.io 0.2.2) so `text_transform`,
# `letter_spacing`, and `div().hidden()` are available natively — no patched vendor tree needed.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97", package = "gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97", package = "gpui_platform" }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
