[package]
name = "crepuscularity-runtime"
version = "0.4.20"
edition = "2021"
license = "ISC"
description = "Runtime parser, GPUI renderer, and hot-reload engine for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-runtime"
readme = "../../README.md"

[features]
default = []
# See `crepuscularity_macros` / gpui_text_run_styles — Zed crates.io `gpui` 0.2.2 lacks these APIs.
gpui_text_run_styles = []

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0", features = ["notify"] }
gpui = { package = "gpui-ce", version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0" }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
