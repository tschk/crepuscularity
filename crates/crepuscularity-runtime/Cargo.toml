[package]
name = "crepuscularity-runtime"
version = "0.5.0"
edition = "2021"
license = "ISC"
description = "Runtime parser, GPUI renderer, and hot-reload engine for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-runtime"
readme = "../../README.md"

[features]
default = ["font-kit"]
# Keep core text shaping and the selected native platform font backend paired.
font-kit = ["gpui/font-kit", "gpui_platform/font-kit"]
# See `crepuscularity_macros` / gpui_text_run_styles — Zed crates.io `gpui` 0.2.2 lacks these APIs.
gpui_text_run_styles = []

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.6.0", features = ["notify"] }
gpui = { package = "gpui-ce", version = "0.2.2", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0" }
stacker = "0.1.24"
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
