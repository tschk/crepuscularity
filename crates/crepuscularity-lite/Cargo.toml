[package]
name = "crepuscularity-lite"
version = "0.4.15"
edition.workspace = true
license.workspace = true
description = "GPUI desktop shell with an embedded V8 runtime and a Rust native-capability bridge."
repository = "https://github.com/tschk/crepuscularity"

[features]
default = []
# Optional Rayon: parallel `guest_prelude` reads.
parallel = ["dep:rayon"]
# CLI helpers (`cl` binary).
cli = ["dep:clap"]
# Terminal benchmark UI + parallel headless V8 matrix (`crepus-bench` binary).
bench-tui = ["cli", "dep:crossterm", "dep:ratatui", "parallel", "v8", "oxc"]
# V8 JavaScript runtime (rusty_v8) — embedded JS evaluation via `v8_host`.
v8 = ["dep:v8", "dep:icu_calendar", "dep:icu_calendar_data", "dep:icu_locale", "dep:icu_locale_data"]
# Oxc TypeScript / TSX / JSX transpiler — transforms `.ts`/`.tsx` guest sources.
oxc = ["dep:oxc_allocator", "dep:oxc_codegen", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span", "dep:oxc_transformer"]

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.5.0" }
arboard = "3.6"
dirs = "6"
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
open = "5.3"
notify-debouncer-mini = "0.7"
palette = { version = "0.7", features = ["serializing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { workspace = true }
serde_json.workspace = true
toml = { workspace = true }
oxc_allocator = { version = "0.128", optional = true }
oxc_codegen = { version = "0.128", optional = true }
oxc_parser = { version = "0.128", optional = true }
oxc_semantic = { version = "0.128", optional = true }
oxc_span = { version = "0.128", optional = true }
oxc_transformer = { version = "0.128", optional = true }
# V8 149+ requires ICU 2.2.x; pins below unify the transitive ICU tree.
v8 = { version = "149", optional = true }
icu_calendar = { version = "=2.2.1", optional = true }
icu_calendar_data = { version = "=2.2.0", optional = true }
icu_locale = { version = "=2.2.0", optional = true }
icu_locale_data = { version = "=2.2.0", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
rayon = { version = "1", optional = true }
shlex = "2.0.1"

[[bin]]
name = "crepuscularity-lite"
path = "src/main.rs"
required-features = ["v8", "oxc"]

[[bin]]
name = "crepus-bench"
path = "src/bin/crepus-bench.rs"
required-features = ["bench-tui"]

[[bin]]
name = "cl"
path = "src/bin/cl.rs"
required-features = ["cli"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
