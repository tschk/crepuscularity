# Pub package name uses an underscore because pub.dev names cannot contain a
# hyphen; the directory, CLI, and docs use `crepuscularity-flutter`.
name: crepuscularity_flutter
description: >-
  Flutter runtime renderer for Crepuscularity View IR and .crepus source — the
  Flutter counterpart to the SwiftUI and Jetpack Compose native shells.
version: 0.2.0
homepage: https://github.com/tschk/crepuscularity
repository: https://github.com/tschk/crepuscularity
issue_tracker: https://github.com/tschk/crepuscularity/issues
topics:
  - ui
  - renderer
  - crepuscularity
  - view-ir

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  crepuscularity_components:
    path: ../crepuscularity-components/packages/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
