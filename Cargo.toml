[workspace]
resolver = "2"
exclude = [
    "examples/advanced",
    "examples/embedded-dashboard",
    "tree-sitter-crepus",
    "tree-sitter-crepusx",
    "plugins/crepuscularity-components/packages/gpui",
]
members = [
    "crates/crepuscularity",
    "crates/crepuscularity-core",
    "crates/crepuscularity-lsp",
    "crates/crepuscularity-native",
    "crates/crepuscularity-embedded",
    "crates/crepuscularity-lvgl",
    "crates/crepuscularity-abi",
    "crates/crepuscularity-gpui",
    "crates/crepuscularity-web",
    "crates/crepuscularity-tauri",
    "crates/crepuscularity-tauri-macros",
    "crates/crepuscularity-webext",
    "crates/crepuscularity_macros",
    "crates/crepuscularity-runtime",
    "crates/crepuscularity-cli",
    "crates/crepuscularity-components",
    "crates/crepuscularity-reactive",
    "crates/crepuscularity-plugin-bindgen",
    "crates/crepuscularity-tui",
    "crates/crepuscularity-wasm",
    # GPUI desktop shell with embedded V8 runtime (build V8 on demand):
    #   cargo build -p crepuscularity-lite
    #   cargo check --workspace --exclude crepuscularity-lite
    "crates/crepuscularity-lite",
    "examples/weather",
] # other examples are kept under examples/advanced and built explicitly

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ABI / cdylib embedders: `cargo build -p crepuscularity-abi --profile abi`
[profile.abi]
inherits = "release"
panic = "abort"
codegen-units = 1



# PGO-optimised release — use via scripts/pgo-build.sh:
#
#   scripts/pgo-build.sh pgo-gen   # step 1 & 2: instrumented build + profile run
#   scripts/pgo-build.sh pgo-use   # step 3:      rebuild with collected profiles
#
# Manual equivalent:
#   RUSTFLAGS="-Cprofile-generate=$(pwd)/target/pgo-profiles" \
#     cargo build --profile pgo -p crepuscularity-cli
#   # run crepus on a representative benchmark
#   RUSTFLAGS="-Cprofile-use=$(pwd)/target/pgo-profiles" \
#     cargo build --profile pgo -p crepuscularity-cli
[profile.pgo]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.package]
version = "0.4.9"
edition = "2021"
license = "ISC"

# ── crepuscularity-lite workspace deps ────────────────────────────────────────
# These are only needed by crepuscularity-lite.
# Build with: cargo build -p crepuscularity-lite [--features cli]
# Check without V8: cargo check --workspace --exclude crepuscularity-lite

[workspace.dependencies]
# One requirement per external crate (loose semver). Run `cargo update` often;
# Cargo.lock records the exact versions used.
# GPUI is the community-edition fork (gpui-ce) via its git main branch, which tracks a newer
# upstream Zed than crates.io `gpui` 0.2.2 and adds `TextTransform` / `letter_spacing` /
# `text_transform` / `div().hidden()` (lets crepuscularity drop its `gpui_text_run_styles` gate).
# Note: switches the dep from crates.io to git, so these crates are not directly publishable.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97", package = "gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c738623ffbcec2aeddc44a645cc6b74646d5cf97", package = "gpui_platform" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
sha2 = "0.11"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = "0.8"
base64 = "0.22"
console = "0.16"
futures-util = "0.3"
http = "1"
indicatif = "0.18"
js-sys = "0.3"
notify = "8"
rayon = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
regex = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
json5 = "0.4"

# Default build uses the gpui-ce git dep above (was crates.io `gpui` 0.2.2).
